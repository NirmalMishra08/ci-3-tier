apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/NirmalMishra08/YOUR_REPO.git
    targetRevision: HEAD
    path: helm/backend

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true