apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-3-tier

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gitops

  template:
    metadata:
      labels:
        app: gitops

    spec:
      containers:
        - name: gitops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"